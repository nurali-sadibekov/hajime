name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  executables:
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: Hajime-windows, sep: ";" }
          - { os: macos-latest, name: Hajime-macos, sep: ":" }
          - { os: ubuntu-latest, name: Hajime-linux, sep: ":" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install ".[exe]"
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name Hajime
          --collect-data customtkinter
          --add-data "hajime/assets${{ matrix.sep }}hajime/assets"
          --paths . packaging/launcher.py
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.name }}.zip Hajime
          else
            zip -r ../${{ matrix.name }}.zip Hajime*
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
