[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hajime-productivity"
version = "1.0.0"
description = "A lightweight Tkinter todo list with Judo belt progress and a Pomodoro timer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hajime contributors" }]
dependencies = []

[project.optional-dependencies]
svg = ["CairoSVG>=2.7"]

[tool.setuptools]
packages = ["hajime"]
include-package-data = true

[tool.setuptools.package-data]
hajime = ["assets/belts/*.svg"]
