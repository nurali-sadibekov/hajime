[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hajime-productivity"
dynamic = ["version"]
description = "A boards-based to-do list with Judo belt progress and a Pomodoro timer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["todo", "pomodoro", "judo", "productivity", "customtkinter"]
authors = [{ name = "Hajime contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
dependencies = ["customtkinter>=5.2", "websocket-client>=1.6"]

[project.optional-dependencies]
svg = ["CairoSVG>=2.7"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1", "twine>=5"]
exe = ["pyinstaller>=6"]

[project.gui-scripts]
hajime = "hajime.__main__:main"

[tool.setuptools]
packages = ["hajime"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "hajime.__version__" }

[tool.setuptools.package-data]
hajime = ["assets/belts/*.svg", "assets/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
